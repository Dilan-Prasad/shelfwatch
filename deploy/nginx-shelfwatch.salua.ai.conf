# Shelfwatch
# shelfwatch.salua.ai -> 127.0.0.1:8020
#
# sudo cp deploy/nginx-shelfwatch.salua.ai.conf /etc/nginx/sites-available/shelfwatch.salua.ai
# sudo ln -sf /etc/nginx/sites-available/shelfwatch.salua.ai /etc/nginx/sites-enabled/shelfwatch.salua.ai
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d shelfwatch.salua.ai

upstream shelfwatch {
    server 127.0.0.1:8020;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name shelfwatch.salua.ai;

    client_max_body_size 1m;

    location / {
        proxy_pass http://shelfwatch;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }

    # SSE stream: no buffering, generous read timeout (a live report runs ~30s)
    location /api/pulse {
        proxy_pass http://shelfwatch;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }
}
